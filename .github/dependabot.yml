version: 2
updates:
  # one weekly PR with minor and patch updates; major versions are upgraded by hand,
  # since they usually need code changes (Vite, TypeScript, React Router)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
