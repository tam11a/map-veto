name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # writes src/data/rotation.generated.json (gitignored), which the app imports
      - run: npm run rotation
      - run: npx tsc
      - run: npm test
      # the prebuild step refreshes the rotation snapshot; it falls back to the built-in list offline
      - run: npm run build
