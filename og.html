<!doctype html>
<!-- Dev-only tool (not part of the build): renders public/og.jpg, the social preview image. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social image · Map Veto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 24px; background: #0b0d12; color: #f3eff6; font: 15px/1.5 Poppins, system-ui, sans-serif; }
    canvas { display: block; max-width: 100%; height: auto; border-radius: 12px; box-shadow: 0 20px 60px rgb(0 0 0 / .6); }
    button { margin: 16px 8px 0 0; padding: 10px 18px; border: 0; border-radius: 999px; font: 600 15px Poppins, sans-serif; cursor: pointer; background: #ff2a36; color: #0d0a12; }
    #status { margin-left: 8px; color: #b7adc2; }
  </style>
</head>
<body>
  <div id="stage">Rendering…</div>
  <button id="save" disabled>Save to public/og.jpg</button><span id="status"></span>
  <script type="module">
    import { renderOg } from '/src/og/render.ts';
    const canvas = await renderOg();
    document.getElementById('stage').replaceChildren(canvas);
    const save = document.getElementById('save'), status = document.getElementById('status');
    save.disabled = false;
    save.onclick = () => canvas.toBlob(async blob => {
      const r = await fetch('/__og', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
      status.textContent = r.ok ? `Saved (${Math.round(blob.size / 1024)} KB)` : `Failed: ${await r.text()}`;
    }, 'image/jpeg', 0.88);
  </script>
</body>
</html>
