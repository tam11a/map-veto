[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# rotation.mjs (CDN-cached competitive rotation) and rooms.mts (captain rooms + short links on Netlify Blobs).
# Functions declare their own /api/* paths, which take precedence over the SPA redirect below.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The custom domain is the canonical address: send the old netlify.app address there,
# keeping the path and query (share links, rooms and overlays keep working).
# public/_redirects is applied before this file, so the same rule sits at its top too.
[[redirects]]
  from = "https://map-veto.netlify.app/*"
  to = "https://map-veto.tam11a.dev/:splat"
  status = 301
  force = true

# Single-page app: every route serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
